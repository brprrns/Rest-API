AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Northwind REST API - Flask on Lambda behind API Gateway, DynamoDB storage, CloudWatch logs

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Used in resource names, e.g. northwind-dev-customers

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        LOG_LEVEL: INFO
        CUSTOMERS_TABLE: !Ref CustomersTable
        PRODUCTS_TABLE: !Ref ProductsTable
        ORDERS_TABLE: !Ref OrdersTable

Resources:
  # ---------- CloudWatch Logs ----------
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/northwind-api-${Stage}
      RetentionInDays: 14

  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/northwind-api-${Stage}-access
      RetentionInDays: 14

  # ---------- API Gateway (HTTP API) ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      AccessLogSettings:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency"}'

  # ---------- Lambda running the Flask app ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub northwind-api-${Stage}
      CodeUri: .
      Handler: handler.lambda_handler
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CustomersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
      Events:
        AnyPath:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # ---------- DynamoDB ----------
  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub northwind-${Stage}-customers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub northwind-${Stage}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub northwind-${Stage}-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: customer_id, AttributeType: S }
        - { AttributeName: order_date, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: customer-index        # must match CustomerIndex in app/models/order.py
          KeySchema:
            - { AttributeName: customer_id, KeyType: HASH }
            - { AttributeName: order_date, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
